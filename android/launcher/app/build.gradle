plugins {
    alias(libs.plugins.android.application)
}

android {

    namespace 'com.revc.game'
    compileSdk 35

    defaultConfig {
        applicationId "com.revc.game"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "reVC-0.0.1"

        ndkVersion '27.2.12479018'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug

            externalNativeBuild {
                cmake {
                    cppFlags '-O3', '-fvisibility=hidden'
                }
            }

            debuggable false
            minifyEnabled true
            shrinkResources true
            jniDebuggable false
            renderscriptDebuggable false

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            signingConfig signingConfigs.debug

            externalNativeBuild {
                cmake {
                    cppFlags '-g', '-DDEBUG'
                }
            }

            debuggable true
            minifyEnabled false
            jniDebuggable true
            renderscriptDebuggable true
        }
    }

    packagingOptions {
        jniLibs.excludes += ['META-INF/*']
        resources.excludes += ['META-INF/*']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    externalNativeBuild {
        cmake {
            path file('CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildFeatures {
        buildConfig = true
    }

    sourceSets {
        main {
            jniLibs.srcDir 'jniLibs'
            jniLibs.srcDir "${rootProject.projectDir}/../../vendor/sdl2/libs/Android"
            jniLibs.srcDir "${rootProject.projectDir}/../../vendor/openal-soft/libs/Android"
            jniLibs.srcDir "${rootProject.projectDir}/../../vendor/mpg123/lib/Android"
            assets.srcDirs += "$buildDir/generated/revcSpriteAssets"
            assets.srcDirs += "$buildDir/generated/revcGamefiles"
            assets.srcDirs += "$buildDir/generated/revcOwnedVcAssets"
        }
    }
}


def revcSpriteRoot = providers.gradleProperty("revcSpriteOutput")
        .orElse(providers.environmentVariable("REVC_SPRITE_OUTPUT"))
        .orElse("${rootProject.projectDir}/../../generated-sprites")

def revcVcAssetRoot = providers.gradleProperty("revcVcAssetRoot")
        .orElse(providers.environmentVariable("REVC_VC_ASSET_ROOT"))

tasks.register("copyPedSpriteAssets", Copy) {
    def sourceDir = revcSpriteRoot.map { file(it) }
    from(sourceDir) {
        include "sprites/peds/**"
    }
    into layout.buildDirectory.dir("generated/revcSpriteAssets")
    doFirst {
        def dir = sourceDir.get()
        if (!dir.exists()) {
            throw new GradleException("Missing generated sprite output: ${dir}. Set -PrevcSpriteOutput=/path/to/output or REVC_SPRITE_OUTPUT.")
        }
        def manifest = new File(dir, "sprites/peds/manifest.txt")
        if (!manifest.exists()) {
            throw new GradleException("Missing ped sprite manifest: ${manifest}")
        }
    }
}



tasks.register("copyRevcGamefiles", Copy) {
    from("${rootProject.projectDir}/../../gamefiles")
    into layout.buildDirectory.dir("generated/revcGamefiles")
}

tasks.register("copyOwnedVcAssets", Copy) {
    def configuredRoot = revcVcAssetRoot
    onlyIf { configuredRoot.isPresent() }
    from(configuredRoot.map { file(it) }) {
        include "DATA/**", "data/**"
        include "MODELS/**", "models/**"
        include "ANIM/**", "anim/**"
        include "AUDIO/**", "audio/**"
        include "TEXT/**", "text/**"
    }
    into layout.buildDirectory.dir("generated/revcOwnedVcAssets")
    doFirst {
        def root = file(configuredRoot.get())
        def missing = []
        def hasFile = { String path -> new File(root, path).isFile() }
        def hasAnyFile = { List<String> paths -> paths.any { hasFile(it) } }
        def hasAnyGlob = { List<String> dirs, String suffix ->
            dirs.any { name ->
                def dir = new File(root, name)
                dir.isDirectory() && (dir.listFiles()?.any { it.isFile() && it.name.toLowerCase(Locale.ROOT).endsWith(suffix) } ?: false)
            }
        }
        if (!hasAnyFile(["MODELS/GTA3.IMG", "models/gta3.img"])) missing << "MODELS/GTA3.IMG"
        // Retail PC installs can keep ped TXDs inside GTA3.IMG instead of TXD.IMG or loose TXDs.
        // Native startup validates the archive contents as needed.
        if (!hasAnyFile(["DATA/DEFAULT.DAT", "data/default.dat"])) missing << "DATA/DEFAULT.DAT"
        if (!hasAnyFile(["DATA/GTA_VC.DAT", "data/gta_vc.dat", "DATA/GTA3.DAT", "data/gta3.dat"])) missing << "DATA/GTA_VC.DAT"
        // DATA/SPECIAL.TXT is optional on retail PC installs; mission specials are discovered when present.
        if (!hasAnyGlob(["ANIM", "anim"], ".ifp")) missing << "ANIM/*.IFP"
        if (!missing.isEmpty()) {
            throw new GradleException("Invalid reVC owned asset root ${root}. Missing:\n - " + missing.join("\n - "))
        }
    }
}


tasks.named("preBuild").configure {
    dependsOn tasks.named("copyPedSpriteAssets")
    dependsOn tasks.named("copyRevcGamefiles")
    dependsOn tasks.named("copyOwnedVcAssets")
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}