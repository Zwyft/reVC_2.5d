plugins {
    alias(libs.plugins.android.application)
}

android {

    namespace 'com.revc.game'
    compileSdk 35

    defaultConfig {
        applicationId "com.revc.game"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "reVC-0.0.1"

        ndkVersion '27.2.12479018'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug

            externalNativeBuild {
                cmake {
                    cppFlags '-O3', '-fvisibility=hidden'
                }
            }

            debuggable false
            minifyEnabled true
            shrinkResources true
            jniDebuggable false
            renderscriptDebuggable false

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            signingConfig signingConfigs.debug

            externalNativeBuild {
                cmake {
                    cppFlags '-g', '-DDEBUG'
                }
            }

            debuggable true
            minifyEnabled false
            jniDebuggable true
            renderscriptDebuggable true
        }
    }

    packagingOptions {
        jniLibs.excludes += ['META-INF/*']
        resources.excludes += ['META-INF/*']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    externalNativeBuild {
        cmake {
            path file('CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig = true
    }

    sourceSets {
        main {
            jniLibs.srcDir 'jniLibs'
            jniLibs.srcDir "${rootProject.projectDir}/../../vendor/sdl2/libs/Android"
            jniLibs.srcDir "${rootProject.projectDir}/../../vendor/openal-soft/libs/Android"
            jniLibs.srcDir "${rootProject.projectDir}/../../vendor/mpg123/lib/Android"
            assets.srcDirs += "$buildDir/generated/revcSpriteAssets"
            assets.srcDirs += "$buildDir/generated/revcGamefiles"
        }
    }
}


def revcSpriteRoot = providers.gradleProperty("revcSpriteOutput")
        .orElse(providers.environmentVariable("REVC_SPRITE_OUTPUT"))
        .orElse("${rootProject.projectDir}/../../generated/sprites")

tasks.register("copyPedSpriteAssets", Copy) {
    def sourceDir = revcSpriteRoot.map { file(it) }
    from(sourceDir) {
        include "sprites/peds/**"
    }
    into layout.buildDirectory.dir("generated/revcSpriteAssets")
    doFirst {
        def dir = sourceDir.get()
        if (!dir.exists()) {
            throw new GradleException("Missing generated sprite output: ${dir}. Set -PrevcSpriteOutput=/path/to/output or REVC_SPRITE_OUTPUT.")
        }
        def manifest = new File(dir, "sprites/peds/manifest.txt")
        if (!manifest.exists()) {
            throw new GradleException("Missing ped sprite manifest: ${manifest}")
        }
    }
}



tasks.register("copyRevcGamefiles", Copy) {
    from("${rootProject.projectDir}/../../gamefiles")
    into layout.buildDirectory.dir("generated/revcGamefiles")
}


tasks.named("preBuild").configure {
    dependsOn tasks.named("copyPedSpriteAssets")
    dependsOn tasks.named("copyRevcGamefiles")
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])

    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}