name: Android APK

on:
  push:
    branches: [ "miami", "main", "master" ]
    paths:
      - '.github/workflows/build-android.yml'
      - 'android/launcher/**'
      - 'src/**'
      - 'tools/**'
      - 'CMakeLists.txt'
      - 'vendor/**'
  pull_request:
    branches: [ "miami", "main", "master" ]
    paths:
      - '.github/workflows/build-android.yml'
      - 'android/launcher/**'
      - 'src/**'
      - 'tools/**'
      - 'CMakeLists.txt'
      - 'vendor/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: APK build type
        required: true
        default: debug
        type: choice
        options:
          - debug


permissions:
  contents: read

jobs:
  build-tools-and-android:
    name: Build Android APK (${{ matrix.variant }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        variant: [debug]

    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      REVC_SPRITE_OUTPUT: ${{ github.workspace }}/build/ci-sprites

    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Make Gradle wrapper executable
        working-directory: android/launcher
        run: chmod +x ./gradlew

      - name: Write local.properties
        working-directory: android/launcher
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Configure host baker
        run: cmake -S tools/ped_sprite_baker -B build/ped-baker -G Ninja

      - name: Build host baker
        run: cmake --build build/ped-baker

      - name: Configure librw-backed baker
        run: cmake -S . -B build/ped-baker-rw -G Ninja -DREVC_BAKER_ONLY=ON -DLIBRW_PLATFORM=NULL -DREVC_BAKER_BUILD=ON

      - name: Build librw-backed baker
        run: cmake --build build/ped-baker-rw --target revc_ped_sprite_baker

      - name: Validate missing asset root failure
        run: |
          set +e
          build/ped-baker/revc_ped_sprite_baker --asset-root /tmp/missing-vc-root --output "$REVC_SPRITE_OUTPUT" >build/missing-root.log 2>&1
          status=$?
          set -e
          cat build/missing-root.log
          test "$status" -eq 1
          grep -q 'MODELS/GTA3.IMG' build/missing-root.log
          grep -q 'ANIM/\*.IFP' build/missing-root.log

      - name: Generate synthetic sprite output for CI
        run: tools/ped_sprite_baker/generate_synthetic_sprites.py --output "$REVC_SPRITE_OUTPUT"

      - name: Explain APK asset mode
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Android APK artifact

          This workflow builds and uploads `app-debug.apk` as a GitHub Actions artifact.

          The APK is a CI build artifact and does not include original GTA Vice City assets.
          It uses a minimal synthetic sprite manifest only so Gradle packaging and native Android compilation can be checked without committing owned game files or generated derivative atlases.

          For a playable personal APK, build locally with `-PrevcVcAssetRoot=/path/to/owned/GTA Vice City` and `-PrevcSpriteOutput=/path/to/generated-sprites`, or provide those private assets to a separate private workflow outside the public repository history.
          EOF

      - name: Validate synthetic sprite manifest coverage
        run: build/ped-baker/revc_ped_sprite_baker --validate-output --output "$REVC_SPRITE_OUTPUT"

      - name: Build ${{ matrix.variant }} APK
        working-directory: android/launcher
        run: ./gradlew assembleDebug --no-daemon --stacktrace --build-cache -PrevcSpriteOutput="$REVC_SPRITE_OUTPUT"

      - name: Upload ${{ matrix.variant }} APK
        uses: actions/upload-artifact@v4
        with:
          name: revc-android-${{ matrix.variant }}-apk-ci-no-owned-assets
          path: android/launcher/app/build/outputs/apk/${{ matrix.variant }}/app-${{ matrix.variant }}.apk
          if-no-files-found: error
